<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop 🌸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌸 Flower Shop</h1>
        <p>Fresh Flowers for Every Occasion</p>
    </header>

    <section class="hero">
        <h2>Make Someone Smile Today 🌷</h2>
        <p>Beautiful flowers for the people you love.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
    </section>

    <h2 class="title" id="products">Our Flowers 🌺</h2>

    <div id="productContainer" class="products"></div>

    <section class="cart">
        <h2>🛒 Your Shopping Cart</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <h3>Total: $<span id="total">0</span></h3>

        <button onclick="checkout()">Checkout</button>
    </section>

    <footer>
        <p>© 2026 Flower Shop | Made with ❤️</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
